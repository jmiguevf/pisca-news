name: Produzir edição (agente)
# O agente (Claude Code, pelo plano do José Miguel) apura, escreve e faz a arte de 1 carrossel + 1 Reels
# e abre a PRÉVIA. Não publica: quem publica é o fluxo "Publicar", no horário.
on:
  schedule:
    - cron: "*/15 7-22 * * *"   # a cada 15 min; o robô só produz a edição cuja janela está aberta e ainda não saiu
  workflow_dispatch:
    inputs:
      edicao:
        description: "manha, meio ou noite (vazio = pela hora)"
        required: false
      refazer:
        description: "Refazer a edição do dia (ex.: 2) — cria uma nova prévia"
        required: false
      corrigir_id:
        description: "Corrigir uma edição pronta (id, ex.: 2026-09-24-noite-2)"
        required: false
      corrigir_tipo:
        description: "carrossel ou reels"
        required: false
      corrigir:
        description: "O que corrigir (texto)"
        required: false
concurrency:
  group: produzir
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  actions: read
jobs:
  produzir:
    if: github.event_name == 'workflow_dispatch' || vars.PISCA_LIGADO != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      MIDIA_TOKEN: ${{ secrets.MIDIA_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      REFAZER: ${{ inputs.refazer }}
      CORRIGIR: ${{ inputs.corrigir }}
      CORRIGIR_ID: ${{ inputs.corrigir_id }}
      CORRIGIR_TIPO: ${{ inputs.corrigir_tipo || 'carrossel' }}
      MODELO: ${{ vars.MODELO || 'claude-opus-5-5' }}
      MODELO_RAPIDO: ${{ vars.MODELO_RAPIDO || 'claude-sonnet-5' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tem edição para produzir agora?
        id: janela
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, datetime as d
          if "${{ github.event_name }}" == "workflow_dispatch":
              print("sim=1"); raise SystemExit
          a = d.datetime.utcnow() - d.timedelta(hours=3); t = a.hour + a.minute / 60
          J = {"manha": (4.5, 8.5), "meio": (9.5, 12.5), "noite": (15.5, 19.0)}
          ed = next((e for e, (x, y) in J.items() if x <= t < y), None)
          feito = ed and os.path.exists(f"fila/{a:%Y-%m-%d}-{ed}/agenda.json")
          print("sim=" + ("1" if ed and not feito else "0"))
          PY
      - uses: actions/setup-python@v5
        if: steps.janela.outputs.sim == '1'
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar
        if: steps.janela.outputs.sim == '1'
        run: |
          npm install -g @anthropic-ai/claude-code@2 --no-audit --no-fund
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Baixar a edição a corrigir
        if: inputs.corrigir_id != ''
        run: |
          RUN=$(python3 -c "import json;print(json.load(open('fila/${{ inputs.corrigir_id }}/agenda.json'))['run_id'])")
          ART=$(python3 -c "import json;print(json.load(open('fila/${{ inputs.corrigir_id }}/agenda.json'))['artefato'])")
          gh run download "$RUN" -n "$ART" -D /tmp/art
          find /tmp/art -name agenda.json -delete
          cp -a /tmp/art/. .
          ls fila/${{ inputs.corrigir_id }}
      - name: Produzir
        id: produzir
        if: steps.janela.outputs.sim == '1'
        run: |
          python robo/produzir.py "${{ inputs.edicao }}"
          if [ -f artefato.txt ]; then { echo 'lista<<FIM'; cat artefato.txt; echo; echo 'FIM'; } >> "$GITHUB_OUTPUT"; fi
          ID=$(head -1 artefato.txt 2>/dev/null | sed 's#fila/##'); echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "nome=$(cat artefato_nome.txt 2>/dev/null)" >> "$GITHUB_OUTPUT"
      - name: Guardar os arquivos da edição (3 dias)
        if: always() && steps.produzir.outputs.id != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.produzir.outputs.nome }}
          path: ${{ steps.produzir.outputs.lista }}
          retention-days: 3
          include-hidden-files: false
      - name: Guardar o registro
        if: always() && steps.janela.outputs.sim == '1'
        run: bash .github/salvar-estado.sh "Produção"
