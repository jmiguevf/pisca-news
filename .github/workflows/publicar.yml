name: Publicar (robô)
# Solta no horário o que a prévia não cancelou: Instagram + Facebook (feed e story) + Threads.
on:
  schedule:
    - cron: "*/10 9-23 * * *"   # a cada 10 min (o agendamento do GitHub atrasa); só publica o que venceu e foi aprovado
    - cron: "*/10 0-3 * * *"    # até meia-noite de Brasília (aprovação tardia da noite)
  issue_comment:              # aprovou na prévia: já confere e publica o que estiver no horário
    types: [created]
  workflow_dispatch:
    inputs:
      agora:
        description: "Publicar já esta edição (ex.: 2026-09-25-manha). Vazio = o que venceu."
        required: false
concurrency:
  group: publicar
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  actions: read
jobs:
  publicar:
    if: (github.event_name == 'workflow_dispatch' || vars.PISCA_LIGADO != '0') && (github.event_name != 'issue_comment' || github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
      COLLAB: ${{ vars.COLLAB }}
      THREADS_USER_ID: ${{ vars.THREADS_USER_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      MIDIA_TOKEN: ${{ secrets.MIDIA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Tem algo para publicar agora?
        id: fila
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, glob, datetime as d
          agora = d.datetime.utcnow() - d.timedelta(hours=3)
          tem = False
          for a in glob.glob("fila/*/agenda.json"):
              for i in json.load(open(a, encoding="utf-8")).get("itens", []):
                  q = d.datetime.fromisoformat(i["quando"])
                  if i["estado"] == "pendente" and q - d.timedelta(minutes=10) <= agora:
                      tem = True
          print("tem=" + ("sim" if tem or "${{ inputs.agora }}" else "nao"))
          PY
      - uses: actions/setup-python@v5
        if: steps.fila.outputs.tem == 'sim'
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar
        if: steps.fila.outputs.tem == 'sim'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Publicar
        if: steps.fila.outputs.tem == 'sim'
        run: |
          if [ -n "${{ inputs.agora }}" ]; then python robo/publicar.py --agora "${{ inputs.agora }}"; else python robo/publicar.py; fi
      - name: Guardar o registro
        if: always() && steps.fila.outputs.tem == 'sim'
        run: bash .github/salvar-estado.sh "Publicação"
